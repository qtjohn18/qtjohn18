<svg xmlns="http://www.w3.org/2000/svg" width="412" height="264" viewBox="0 0 412 264" role="img" aria-label="Strategy desks: options, HFT, market making, prop firm cycling, macro/news. Self-built backtesting, execution and options-flow tools">
<title>Strategy desks: options, HFT, market making, prop firm cycling, macro/news. Self-built backtesting, execution and options-flow tools</title>
<style>
text{font-family:ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'Courier New',monospace}
.o{animation:show .25s ease-out both}
.f{animation:show .35s ease-out both}
@keyframes show{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.05s step-end infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.grow{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pop{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
</style>
<defs><clipPath id="win"><rect width="412" height="264" rx="10"/></clipPath><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern></defs>
